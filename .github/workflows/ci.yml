name: EqoBoard CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust data / gateway / execution
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # toolchain 1.99.0
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check

  market-contracts:
    name: Offline market-data contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.15
      - name: Verify Python toolchain
        run: test "$(python --version)" = 'Python 3.12.15'
      - name: Generate pinned OpenTerminal upstream file audit
        run: python3 tools/upstream_diff.py >> "$GITHUB_STEP_SUMMARY"
      - run: python3 tools/ci/run-contract-tests.py core

  openterminal:
    name: OpenTerminal / AG Grid / Next.js
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/openterminal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/openterminal/package-lock.json
      - name: Verify Node toolchain
        run: test "$(node --version)" = 'v22.23.3'
      - name: Test trusted auto-merge policy
        working-directory: .
        run: node --test tests/auto_merge_policy.test.cjs
      - name: Test optional-module isolation and BuildKit cache contracts
        working-directory: .
        run: node --test tools/ci/openbb-ci-route.test.mjs tools/ci/openbb-ci-gate.test.mjs tools/ci/buildkit-contract.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w server
      - run: npm run test -w server
      - name: Test local Futu subscription and workstation boundaries
        working-directory: .
        run: |
          node --test tools/futu-subscriptions.test.mjs
          node --import ./apps/openterminal/node_modules/tsx/dist/loader.mjs --test tools/local-access.test.ts
      - name: Test client cancellation during BFF authorization
        run: node --test web/lib/client-abort.test.mjs
      - run: npx tsc --noEmit -p web/tsconfig.json
      - run: npm run build -w web
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: Verify unified history BFF and chart consumers with isolated synthetic providers
        working-directory: apps/openterminal/web
        env:
          E2E_MDP_MARKET_BARS_ENABLED: "true"
        run: npx playwright test -c playwright.config.ts e2e/market-bars-bff.spec.ts e2e/market-data-chart-history.spec.ts
      - name: Verify legacy history rollback
        working-directory: apps/openterminal/web
        env:
          E2E_MDP_MARKET_BARS_ENABLED: "false"
        run: npx playwright test -c playwright.config.ts e2e/market-bars-bff.spec.ts --grep 'disabled|legacy|rollback'
      - name: Verify MDP history without optional Gateway signer
        working-directory: apps/openterminal/web
        env:
          E2E_MDP_MARKET_BARS_ENABLED: "true"
          E2E_GATEWAY_SIGNER_DISABLED: "true"
        run: npx playwright test -c playwright.config.ts e2e/market-bars-bff.spec.ts --grep 'Gateway|signer'
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          use: true
      - name: Prewarm Gateway image with isolated BuildKit cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          tags: eqoboard:ci-cache
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          push: false
          cache-from: type=gha,scope=eqoboard-gateway,version=2
          cache-to: type=gha,scope=eqoboard-gateway,mode=max,version=2,ignore-error=true
      - name: Prewarm OpenTerminal runtime image with isolated BuildKit cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/openterminal/Dockerfile
          target: runtime
          tags: eqoboard-openterminal-runtime:local
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          push: false
          cache-from: type=gha,scope=openterminal-runtime,version=2
          cache-to: type=gha,scope=openterminal-runtime,mode=max,version=2,ignore-error=true
      - name: Prewarm Compose E2E image with isolated BuildKit cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/openterminal/Dockerfile
          target: compose-e2e
          tags: eqoboard-openterminal-compose-e2e:local
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          push: false
          cache-from: type=gha,scope=openterminal-compose-e2e,version=2
          cache-to: type=gha,scope=openterminal-compose-e2e,mode=max,version=2,ignore-error=true
      - name: Validate compose contract
        working-directory: .
        run: |
          set -euo pipefail
          env -i PATH="$PATH" docker compose --env-file /dev/null config --quiet
          assert_option_lease_config() {
            local env_file="$1" expected_total="$2" expected_principal="$3"
            env -i PATH="$PATH" docker compose --env-file "$env_file" config --format json | node -e '
              let input = "";
              const [expectedTotal, expectedPrincipal] = process.argv.slice(1);
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                try {
                  const config = JSON.parse(input);
                  const environment = config.services?.eqoboard?.environment;
                  if (environment?.EQO_MAX_OPTION_LEASES !== expectedTotal ||
                      environment?.EQO_MAX_OPTION_LEASES_PER_PRINCIPAL !== expectedPrincipal) {
                    throw new Error("Compose did not render the expected option lease limits");
                  }
                } catch (error) {
                  console.error(error.message);
                  process.exitCode = 1;
                }
              });
            ' "$expected_total" "$expected_principal"
          }
          assert_option_lease_config /dev/null 1024 32
          synthetic_env="$(mktemp)"
          trap 'rm -f "$synthetic_env"' EXIT
          printf 'EQO_MAX_OPTION_LEASES=7\nEQO_MAX_OPTION_LEASES_PER_PRINCIPAL=3\n' > "$synthetic_env"
          assert_option_lease_config "$synthetic_env" 7 3
      - name: Build and exercise production containers with offline mocks
        working-directory: .
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          COMPOSE_BAKE: "true"
        run: bash tools/container-e2e.sh
