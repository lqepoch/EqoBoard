name: EqoBoard CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust data / gateway / execution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  market-contracts:
    name: Offline market-data contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  openterminal:
    name: OpenTerminal / AG Grid / Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/openterminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/openterminal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w server
      - run: npm run test -w server
      - run: npx tsc --noEmit -p web/tsconfig.json
      - run: npm run build -w web
      - name: Validate deployment schema
        working-directory: .
        env:
          EQO_ACCESS_TOKEN: ci-only-token
        run: docker compose config --quiet
