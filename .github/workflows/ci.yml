name: EqoBoard CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust domain / market data / gateway / execution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit / integration tests (no credentials)
        run: cargo test --workspace
      - name: Formatting
        run: cargo fmt --all -- --check

  web:
    name: Web typed checks / tests / production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: eqoboard-web-dist
          path: apps/web/dist
          retention-days: 7

  market-contracts:
    name: Offline market-data contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify SIP/OPRA smoke error handling without credentials
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
