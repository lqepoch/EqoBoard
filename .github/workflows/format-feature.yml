name: One-time Rust formatter (trusted feature branch only)

on:
  push:
    branches: [feat/initial-market-terminal]
    paths:
      - '.github/workflows/format-feature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'lqepoch/EqoBoard' && github.ref == 'refs/heads/feat/initial-market-terminal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format all Rust source
        run: cargo fmt --all
      - name: Resolve reproducible dependencies
        run: |
          cargo generate-lockfile
          (cd apps/web && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
      - name: Commit rustfmt and dependency lockfiles, if any
        run: |
          git add crates apps/gateway Cargo.lock apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git commit -m 'build: lock Rust and JavaScript dependency resolution'
            git push origin HEAD:feat/initial-market-terminal
          fi
