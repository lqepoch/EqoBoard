name: Format OpenTerminal Integration Branch

on:
  push:
    branches: [feat/openterminal-openbb-native]
    paths:
      - '.github/workflows/format-openterminal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.repository == 'lqepoch/EqoBoard' && github.ref == 'refs/heads/feat/openterminal-openbb-native'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Rust formatting
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          git add apps/gateway crates
          if ! git diff --cached --quiet; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git commit -m 'style: apply rustfmt to OpenTerminal/OpenBB integration'
            git push origin HEAD:feat/openterminal-openbb-native
          fi
