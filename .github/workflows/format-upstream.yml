name: One-time Rust formatter for vetted upstream integration branch

on:
  push:
    branches: [feat/openterminal-openbb-upstream]
    paths: ['.github/workflows/format-upstream.yml']

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.repository == 'lqepoch/EqoBoard' && github.ref == 'refs/heads/feat/openterminal-openbb-upstream'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonical Rust formatting
        run: cargo fmt --all
      - name: Commit and push formatter output
        run: |
          git add crates apps/gateway
          if ! git diff --cached --quiet; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git commit -m 'style: apply rustfmt to OpenBB Gateway bridge'
            git push origin HEAD:feat/openterminal-openbb-upstream
          fi
