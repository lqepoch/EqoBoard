name: Alpaca SIP + OPRA read-only smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 16 * * 1"
  push:
    branches: [main]
    paths:
      - 'crates/alpaca-data/**'
      - 'tools/check_alpaca_feeds.py'
      - '.github/workflows/market-data-smoke.yml'

permissions:
  contents: read

concurrency:
  group: alpaca-entitlements
  cancel-in-progress: false

jobs:
  entitlement-check:
    name: Verify real SIP/OPRA entitlements (never submit orders)
    if: github.repository == 'lqepoch/EqoBoard' && github.ref == 'refs/heads/main'
    environment: market-data-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.15
      - name: Verify Python toolchain
        run: test "$(python --version)" = 'Python 3.12.15'
      - name: Probe read-only Alpaca Market Data APIs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python3 tools/check_alpaca_feeds.py
