name: Native Web CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NATIVE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: native-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Native web lock bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Require a committed native lockfile
        id: bootstrap
        working-directory: apps/eqoboard-web
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json && node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const normalized = (value) => JSON.stringify(Object.entries(value ?? {}).sort(([a], [b]) => a.localeCompare(b)));
            const fields = ["dependencies", "devDependencies", "optionalDependencies"];
            process.exit(fields.every((field) => normalized(manifest[field]) === normalized(lock.packages?.[""]?.[field])) ? 0 : 1);
          '; then
            echo 'missing=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'missing=true' >> "$GITHUB_OUTPUT"
          # Git dependencies execute prepare even under --ignore-scripts.
          # --package-lock-only propagates into Core prepare and prevents its
          # nested npm ci from installing TypeScript, so resolve in this isolated
          # Actions workspace without that flag. Retain an existing lock as the
          # resolution input when pruning removed dependencies. Nothing here is acceptance.
          npm install --ignore-scripts --include=dev --no-audit --no-fund
          echo '::error::Bootstrap lock is a proposal artifact only. Commit and review it before acceptance.'
          exit 1
      - name: Preserve proposed lock without accepting generated dependencies
        if: always() && steps.bootstrap.outputs.missing == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lock-bootstrap-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: apps/eqoboard-web/package-lock.json
          if-no-files-found: warn
          retention-days: 7
  validate:
    name: Native web package and runtime checks
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/eqoboard-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/eqoboard-web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.15
      - name: Install committed dependency graph
        id: install
        run: npm ci --no-audit --no-fund
      - name: Scan candidate source and commits for secrets
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/native-web-secret-scan.sh
      - name: Native source boundary and legacy preservation
        working-directory: .
        run: |
          git diff --check
          node tools/migration/legacy-integrity.mjs
          python3 tools/ci/run-contract-tests.py native
          node --test tools/ci/native-provenance-audit.test.mjs
          node tools/ci/native-provenance-audit.mjs
      - name: TypeScript contracts
        if: always() && steps.install.outcome == 'success'
        run: npm run typecheck
      - name: Source lint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint -- --max-diagnostics=none
      - name: Source formatting
        if: always() && steps.install.outcome == 'success'
        run: npm run format:check
      - name: Native unit and route contracts
        if: always() && steps.install.outcome == 'success'
        run: npm run test:unit
      - name: Dependency vulnerability audit
        if: always() && steps.install.outcome == 'success'
        run: npm audit --audit-level=high
      - name: Dependency licenses and source attribution
        if: always() && steps.install.outcome == 'success'
        working-directory: .
        run: |
          node --test tools/ci/native-license-policy.test.mjs tools/ci/native-runtime-package-audit.test.mjs
          node --test tools/ci/native-binary-inventory.test.mjs
          node tools/ci/native-license-audit.mjs
      - name: Build independent production app
        run: npm run build
      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - name: Build independent runtime image
        id: native_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/eqoboard-web
          file: ./apps/eqoboard-web/Dockerfile
          target: runtime
          tags: eqoboard-native-web:ci
          labels: |
            org.opencontainers.image.source=https://github.com/lqepoch/EqoBoard
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          push: false
          cache-from: type=gha,scope=native-web-runtime,version=2
          cache-to: type=gha,scope=native-web-runtime,mode=max,version=2,ignore-error=true
      - name: Production containers, OIDC and browser acceptance
        working-directory: .
        env:
          NATIVE_WEB_IMAGE: eqoboard-native-web:ci
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: bash tools/native-web-compose-e2e.sh
      - name: Install fixed SBOM scanner
        id: native_sbom_scanner
        if: always() && steps.native_image.outcome == 'success'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-syft"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/native-syft/syft.tar.gz" https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz
          echo 'c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  '"$RUNNER_TEMP/native-syft/syft.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/native-syft/syft.tar.gz" -C "$RUNNER_TEMP/native-syft" syft
          echo "$RUNNER_TEMP/native-syft" >> "$GITHUB_PATH"
      - name: Source and runtime image SBOM
        if: always() && steps.native_image.outcome == 'success' && steps.native_sbom_scanner.outcome == 'success'
        working-directory: .
        env:
          NATIVE_WEB_IMAGE: eqoboard-native-web:ci
          NATIVE_IMAGE_CONFIG_DIGEST: ${{ steps.native_image.outputs.imageid }}
          NATIVE_IMAGE_BUILD_DIGEST: ${{ steps.native_image.outputs.digest }}
        run: bash tools/native-web-sbom.sh
      - name: Propose formatting fixes without changing tested source
        if: failure() && steps.install.outcome == 'success'
        working-directory: .
        run: bash tools/native-web-format-proposal.sh
      - name: Preserve actual native validation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-validation-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/eqoboard-web/test-results/
            apps/eqoboard-web/playwright-report/
            ${{ runner.temp }}/native-web-sbom/
            ${{ runner.temp }}/native-license-audit.json
            ${{ runner.temp }}/native-web-source-drift.json
            ${{ runner.temp }}/native-format-proposal/
          if-no-files-found: warn
          retention-days: 7
  windows-runtime:
    name: Native Windows runtime and local launch
    needs: lock
    # Node 22's bundled node-gyp supports VS 2022, not the VS 2026 image.
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # npm's fixed public Git dependency may normalize to SSH. Use anonymous
      # HTTPS without introducing an SSH key or mutating the runner's Git config.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            apps/eqoboard-web/package-lock.json
            tools/futu-runtime/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # toolchain 1.99.0
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-windows-release
          # The action sets CACHE_ON_FAILURE from this input; an env override is lost.
          # Fingerprinted build cache is separate from acceptance of the full lane.
          cache-on-failure: true
      - name: Install exact Windows dependency graphs
        shell: pwsh
        run: |
          npm ci --prefix apps/eqoboard-web --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix tools/futu-runtime --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tools/futu-subscriptions.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install fixed NASM for the Windows TLS implementation
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nasm-2.16.03-win64.zip'
          Invoke-WebRequest https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6') { throw 'NASM checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'nasm')
          Join-Path $env:RUNNER_TEMP 'nasm/nasm-2.16.03' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows Gateway
        run: cargo build --locked --release -p eqo-gateway
      - name: Build Windows standalone Web
        working-directory: apps/eqoboard-web
        run: npm run build
      - name: Package immutable local-evaluation runtime
        shell: pwsh
        run: tools/ci/package-native-windows.ps1 -OutputPath "$env:RUNNER_TEMP/native-windows" -CandidateSha $env:NATIVE_CANDIDATE_SHA
      - name: Install Windows browser
        working-directory: apps/eqoboard-web
        run: npx playwright install chromium
      - name: Validate packaged local startup and identity boundary
        shell: pwsh
        run: tools/ci/smoke-native-windows.ps1 -PackagePath "$env:RUNNER_TEMP/native-windows/runtime" -CandidateSha $env:NATIVE_CANDIDATE_SHA
      - name: Preserve verified Windows runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-${{ env.NATIVE_CANDIDATE_SHA }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-windows/eqoboard-windows-x64.zip
            ${{ runner.temp }}/native-windows/ARCHIVE_SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Windows smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-failure-${{ env.NATIVE_CANDIDATE_SHA }}-${{ github.run_id }}
          path: |
            apps/eqoboard-web/test-results/local/
            ${{ runner.temp }}/native-local-smoke/data/native-local/*.log
            ${{ runner.temp }}/native-windows/runtime/SHA256SUMS
            ${{ runner.temp }}/native-windows/runtime/runtime.json
          if-no-files-found: warn
          retention-days: 7
  gate:
    name: Native web validation gate
    if: always()
    needs: [lock, validate, windows-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native lane
        env:
          LOCK_RESULT: ${{ needs.lock.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          WINDOWS_RESULT: ${{ needs.windows-runtime.result }}
        run: test "$LOCK_RESULT" = success && test "$VALIDATION_RESULT" = success && test "$WINDOWS_RESULT" = success
