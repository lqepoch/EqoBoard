name: Pine Script Plugin Contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Pine script contract tests (no live credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Verify Node toolchain
        run: test "$(node --version)" = 'v22.23.3'
      - name: Execute bounded read-only protocol suite
        run: |
          node --check packages/pine-script-plugin/src/contract.mjs
          node --check packages/pine-script-plugin/src/runtime.mjs
          node --check packages/pine-script-plugin/src/pinets-adapter.mjs
          node --check packages/pine-script-plugin/src/isolated-worker.mjs
          node --check packages/pine-script-plugin/src/worker-child.mjs
          node --test packages/pine-script-plugin/tests/*.test.mjs
