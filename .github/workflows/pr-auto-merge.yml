name: Trusted PR Auto Merge

# Both triggers run the trusted default-branch workflow. This workflow reads PR
# evidence through GitHub APIs and never checks out or executes PR head content.
on:
  workflow_run:
    workflows: ["EqoBoard CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to re-evaluate against current main evidence
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: trusted-pr-auto-merge-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safe-merge:
    if: >-
      github.repository == 'lqepoch/EqoBoard' &&
      github.ref == 'refs/heads/main' &&
      vars.EQO_AUTOMERGE_APP_CLIENT_ID != '' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    environment: auto-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out only the trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Mint EqoBoard-only least-privilege App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.EQO_AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EQO_AUTOMERGE_APP_PRIVATE_KEY }}
          owner: lqepoch
          repositories: EqoBoard
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-metadata: read
          permission-pull-requests: write
          permission-contents: write

      - name: Evaluate current evidence and merge only an eligible head SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { runAutoMerge } = require(`${process.env.GITHUB_WORKSPACE}/tools/auto_merge/orchestrator.cjs`);
            const result = await runAutoMerge({
              github,
              context,
              notify: (message) => core.notice(message),
            });

            core.summary.addHeading('Trusted pull request auto-merge');
            if (result.state === 'merged') {
              core.summary.addRaw(`Merged PR #${result.pullNumber} at ${result.mergeSha}.\n`);
              await core.summary.write();
              return;
            }

            const reasons = Array.isArray(result.reasons) ? result.reasons : ['unknown-block'];
            core.summary.addRaw(`Automatic merge blocked: ${reasons.join(', ')}\n`);
            await core.summary.write();
            core.setFailed(`Automatic merge blocked by policy: ${reasons.join(', ')}`);
