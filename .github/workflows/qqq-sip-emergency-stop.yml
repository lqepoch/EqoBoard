name: Emergency stop and delete public SIP artifacts
on:
  push:
    branches: [main]
    paths: [.github/workflows/qqq-sip-emergency-stop.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  stop:
    if: github.repository == 'lqepoch/EqoBoard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Cancel exposed SIP export, delete run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'Cancelling raw market data export in public repository'
          gh api --method POST "repos/$GH_REPO/actions/runs/37709013092/cancel" || true
          for i in $(seq 1 120); do
            status=$(gh api "repos/$GH_REPO/actions/runs/37709013092" --jq '.status')
            [ "$status" = completed ] && break
            sleep 2
          done
          for run in 37708759121 37709013092; do
            ids=$(gh api "repos/$GH_REPO/actions/runs/$run/artifacts?per_page=100" --jq '.artifacts[].id')
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id" >/dev/null
              echo "Deleted artifact $id from public run $run"
            done <<< "$ids"
            remaining=$(gh api "repos/$GH_REPO/actions/runs/$run/artifacts?per_page=100" --jq '.total_count')
            echo "Remaining artifacts in public run $run: $remaining"
            [ "$remaining" = "0" ] || exit 1
          done
