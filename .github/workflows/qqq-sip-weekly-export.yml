name: Retire public QQQ SIP artifacts
on:
  push:
    branches: [main]
    paths: [.github/workflows/qqq-sip-weekly-export.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Intentionally cancels any still-running read-only export in the SAME group.
concurrency:
  group: qqq-sip-weekly-2026
  cancel-in-progress: true

jobs:
  secure-retirement:
    if: github.repository == 'lqepoch/EqoBoard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Cancel export run and remove publicly readable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for rid in 37708759121 37709013092; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$rid/cancel" >/dev/null 2>&1 || true
          done
          for attempt in $(seq 1 120); do
            state=$(gh api "repos/$GH_REPO/actions/runs/37709013092" --jq '.status')
            if [ "$state" = completed ]; then break; fi
            sleep 2
          done
          state=$(gh api "repos/$GH_REPO/actions/runs/37709013092" --jq '.status')
          if [ "$state" != completed ]; then
            echo 'Unable to confirm previous export stopped; retry retirement' >&2
            exit 1
          fi
          for rid in 37708759121 37709013092; do
            ids=$(gh api "repos/$GH_REPO/actions/runs/$rid/artifacts?per_page=100" --jq '.artifacts[].id')
            while IFS= read -r artifact_id; do
              [ -n "$artifact_id" ] || continue
              gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id" >/dev/null
              echo "Deleted GitHub Actions public artifact from run $rid"
            done <<< "$ids"
            remaining=$(gh api "repos/$GH_REPO/actions/runs/$rid/artifacts?per_page=100" --jq '.total_count')
            if [ "$remaining" != 0 ]; then
              echo "Artifacts remain in run $rid; manual inspection required" >&2
              exit 1
            fi
          done
          echo 'Public SIP export stopped and artifacts deleted. Existing private Google Drive W01 remains untouched.'
