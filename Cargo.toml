[workspace]
resolver = "2"
members = ["crates/domain", "crates/alpaca-data", "crates/execution", "apps/gateway"]
# The pinned Actions checkout is an independent backend with its own lockfile.
exclude = ["data/ci-mdp-source"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.98.1"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "=1.53.2", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
market-contracts = { git = "https://github.com/lqepoch/trading-core.git", rev = "f793be47ab90ebff9f530c8b08f41db5e774e4e5", package = "market-contracts" }
broker-ports = { git = "https://github.com/lqepoch/broker-connectors.git", rev = "99e1d36f864d1e89e8cfba95651d29920e2f4c5a", package = "broker-ports" }
alpaca-stream = { git = "https://github.com/lqepoch/broker-connectors.git", rev = "99e1d36f864d1e89e8cfba95651d29920e2f4c5a", package = "alpaca-stream" }
