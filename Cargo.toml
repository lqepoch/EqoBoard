[workspace]
resolver = "2"
members = ["crates/domain", "crates/alpaca-data", "crates/execution", "apps/gateway"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.98.1"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "=1.53.2", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
market-contracts = { git = "https://github.com/lqepoch/trading-core.git", rev = "95ef156e6c0693072fdaddbd27da4214089331ae", package = "market-contracts" }
broker-ports = { git = "https://github.com/lqepoch/broker-connectors.git", rev = "de121017b6698601c5720e705ce298683aa3fdff", package = "broker-ports" }
alpaca-stream = { git = "https://github.com/lqepoch/broker-connectors.git", rev = "de121017b6698601c5720e705ce298683aa3fdff", package = "alpaca-stream" }
