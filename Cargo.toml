[workspace]
resolver = "2"
members = ["crates/domain", "crates/alpaca-data", "crates/execution", "apps/gateway"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.98.1"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
market-contracts = { git = "https://github.com/lqepoch/trading-core", rev = "0a2eaff08d45e8abc1a0137dab17d5d3ef5553c8", package = "market-contracts" }
