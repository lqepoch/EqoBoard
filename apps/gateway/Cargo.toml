[package]
name = "eqo-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
eqo-domain = { path = "../../crates/domain" }
eqo-alpaca-data = { path = "../../crates/alpaca-data" }
eqo-execution = { path = "../../crates/execution" }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws", "json"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
uuid.workspace = true
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { version = "=10.2.0", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
eqo-alpaca-data = { path = "../../crates/alpaca-data", features = ["test-utils"] }
