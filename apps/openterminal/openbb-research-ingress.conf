server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 64k;
    client_body_timeout 5s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 20s;

    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /_ingress/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # auth_request uses this location internally. A browser cannot call it.
    location = /_internal/research-auth-check {
        internal;
        proxy_pass http://openbb-research-bff:3000/api/research/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /api/research/auth-check {
        return 404;
    }

    location = /api/healthz {
        proxy_pass http://openbb-research-bff:3000;
    }

    location = /api/readyz {
        proxy_pass http://openbb-research-bff:3000;
    }

    location = /api/openbb {
        auth_request /_internal/research-auth-check;
        error_page 401 = @api_unauthorized;
        error_page 403 = @api_forbidden;
        proxy_pass http://openbb-research-bff:3000;
    }

    # NextAuth routes are public so the identity flow can establish its own
    # host-only research cookies. Unrecognized API paths remain gated by Lite.
    location ~ ^/api/auth/(providers|csrf|session|signin(/eqo-oidc)?|callback/eqo-oidc|signout|verify-request|error)$ {
        proxy_pass http://openbb-research-bff:3000;
    }

    location ^~ /api/openbb/ {
        auth_request /_internal/research-auth-check;
        error_page 401 = @api_unauthorized;
        error_page 403 = @api_forbidden;
        proxy_pass http://openbb-research-bff:3000;
    }

    location /api/ {
        auth_request /_internal/research-auth-check;
        error_page 401 = @api_unauthorized;
        error_page 403 = @api_forbidden;
        proxy_pass http://openbb-lite:3000;
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Set-Cookie;
    }

    location / {
        auth_request /_internal/research-auth-check;
        error_page 401 = @ui_unauthorized;
        error_page 403 = @ui_forbidden;
        proxy_pass http://openbb-lite:3000;
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Set-Cookie;
    }

    location @api_unauthorized {
        internal;
        default_type application/json;
        return 401 '{"error":"authentication_required"}';
    }

    location @api_forbidden {
        internal;
        default_type application/json;
        return 403 '{"error":"market_reader_role_required"}';
    }

    location @ui_unauthorized {
        internal;
        return 302 /api/auth/signin/eqo-oidc?callbackUrl=%2F;
    }

    location @ui_forbidden {
        internal;
        default_type text/plain;
        return 403 "This account is not authorized to open the research workspace.\n";
    }
}
