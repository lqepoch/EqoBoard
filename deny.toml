# Dependency policy for the locked Rust workspace. Update this file only after
# reviewing exact package metadata, upstream license evidence, and advisories.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P7D"
ignore = []

[licenses]
# Permissive SPDX identifiers observed in the full feature/dev/build graph.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.95
include-dev = true
include-build = true
unused-allowed-license = "deny"
exceptions = [
  # The crate contains Mozilla trust-root data under CDLA-Permissive-2.0.
  # Pin acceptance to the two exact locked crate versions; do not allow the
  # data license for unrelated Rust packages.
  { crate = "webpki-roots@0.26.11", allow = ["CDLA-Permissive-2.0"] },
  { crate = "webpki-roots@1.0.9", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"
allow-workspace = true
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/lqepoch/trading-core",
    "https://github.com/lqepoch/broker-connectors",
]
unused-allowed-source = "deny"
